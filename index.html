<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />

        <title>DevClub Jokenpô</title>
    </head>
    <body>
        <div class="container">
            <h1>Tchê Pô</h1>

            <div class="button">
                <button id="rock" onclick="playHuman('paper')">
                    &#x1F44A;
                </button>

                <button id="paper" onclick="playHuman('rock')">
                    &#x1F590;
                </button>

                <button id="scissors" onclick="playHuman('scissors')">
                    &#x270C;
                </button>
            </div>
            <p class="result"></p>

            <p class="human-score">
                tchê venceu:<span id="human-score">0</span>
            </p>
            <p class="machine-score">
                vivente venceu:<span id="machine-score">0</span>
            </p>
        </div>
        <script src="scripts.js"></script>
    </body>
</html>
